<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Text Compare — Compare Two Texts Online</title>
<meta name="description" content="Free online tool to compare two blocks of text and highlight additions, deletions, and changes side by side. Runs entirely in your browser — nothing is ever sent to a server." />
<meta name="google-site-verification" content="l0C32jaImRYngPnBZuOuazcBqCZQjFv3WLgOJn-ZrBw" />
<link rel="canonical" href="https://isitest1.github.io/text-compare/" />
<link rel="icon" type="image/svg+xml" href="icon.svg" />
<link rel="stylesheet" href="styles.css" />

<meta property="og:type" content="website" />
<meta property="og:title" content="Text Compare — Compare Two Texts Online" />
<meta property="og:description" content="Free online tool to compare two blocks of text and highlight additions, deletions, and changes side by side. Runs entirely in your browser." />
<meta property="og:url" content="https://isitest1.github.io/text-compare/" />
<meta property="og:image" content="https://isitest1.github.io/text-compare/og-image.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />

<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Text Compare — Compare Two Texts Online" />
<meta name="twitter:description" content="Free online tool to compare two blocks of text and highlight additions, deletions, and changes side by side. Runs entirely in your browser." />
<meta name="twitter:image" content="https://isitest1.github.io/text-compare/og-image.png" />

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "Text Compare",
  "url": "https://isitest1.github.io/text-compare/",
  "description": "Free online tool to compare two blocks of text and highlight additions, deletions, and changes side by side. Runs entirely in the browser.",
  "applicationCategory": "UtilitiesApplication",
  "operatingSystem": "Any",
  "offers": {
    "@type": "Offer",
    "price": "0",
    "priceCurrency": "USD"
  }
}
</script>
</head>
<body>
<div class="app">
  <header class="app-header">
    <div class="brand">
      <img src="icon.svg" alt="" class="brand-icon" width="28" height="28" />
      <h1>Text Compare</h1>
    </div>
    <p class="lead">Paste two blocks of text below to compare them and highlight additions, deletions, and changes.</p>
  </header>

  <div class="toolbar">
    <button id="compareBtn" class="btn btn-primary" type="button">Compare</button>
    <button id="swapBtn" class="btn" type="button">Swap Sides</button>
    <button id="clearBtn" class="btn" type="button">Clear</button>
    <label class="checkbox-label">
      <input type="checkbox" id="ignoreWhitespace" />
      Ignore leading/trailing whitespace
    </label>
    <label class="checkbox-label">
      <input type="checkbox" id="wrapLines" checked />
      Wrap long lines
    </label>
    <span class="hint">(<kbd>Ctrl</kbd>/<kbd>Cmd</kbd> + <kbd>Enter</kbd> to compare)</span>
  </div>

  <div class="summary" id="summary" hidden>
    <span class="stat stat-added">Added <strong id="addedCount">0</strong> lines</span>
    <span class="stat stat-removed">Removed <strong id="removedCount">0</strong> lines</span>
    <span class="stat stat-changed">Changed <strong id="changedCount">0</strong> lines</span>
  </div>

  <div class="input-area">
    <div class="pane">
      <label for="leftInput">Before</label>
      <textarea id="leftInput" spellcheck="false" placeholder="Paste the original text here"></textarea>
    </div>
    <div class="pane">
      <label for="rightInput">After</label>
      <textarea id="rightInput" spellcheck="false" placeholder="Paste the changed text here"></textarea>
    </div>
  </div>

  <div class="diff-area" id="diffArea" hidden>
    <div class="diff-grid" id="diffGrid">
      <div class="diff-grid-header header-left">Before</div>
      <div class="diff-grid-header header-right">After</div>
    </div>
  </div>

  <footer class="app-footer">
    <p>All comparisons run entirely in your browser. Your text is never sent to or stored on a server.</p>
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/diff@5/dist/diff.min.js"></script>
<script src="app.js"></script>
</body>
</html>
